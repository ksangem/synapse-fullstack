# CI/CD Dashboard — unified build status report (GitHub Actions summary + job overview)
# Open: Actions → "CI/CD Dashboard" or run manually for a fresh report
name: CI/CD Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read
  actions: read

jobs:
  dashboard:
    name: Build & Deploy Status
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate dashboard
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = [
              { file: 'frontend-ci.yml', label: 'Frontend CI', emoji: '🎨' },
              { file: 'backend-ci.yml', label: 'Backend CI', emoji: '⚙️' },
              { file: 'frontend-deploy.yml', label: 'Frontend Deploy', emoji: '🚀' },
              { file: 'backend-deploy.yml', label: 'Backend Deploy', emoji: '🚀' },
            ];
            const { owner, repo } = context.repo;
            const lines = [
              '# Synapse CI/CD Dashboard',
              '',
              `**Repository:** [${owner}/${repo}](${context.payload.repository.html_url})`,
              `**Generated:** ${new Date().toISOString()}`,
              '',
              '| Pipeline | Last run | Status | Branch | Duration | Link |',
              '|----------|----------|--------|--------|----------|------|',
            ];
            const icons = {
              success: '✅',
              failure: '❌',
              cancelled: '⚪',
              skipped: '⏭️',
              in_progress: '🔄',
              queued: '🕐',
              null: '❓',
            };
            for (const wf of workflows) {
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: wf.file,
                  per_page: 1,
                });
                const run = data.workflow_runs[0];
                if (!run) {
                  lines.push(`| ${wf.emoji} ${wf.label} | — | ❓ Never run | — | — | — |`);
                  continue;
                }
                const icon = icons[run.conclusion] || icons[run.status] || '❓';
                const dur = run.run_started_at && run.updated_at
                  ? `${Math.round((new Date(run.updated_at) - new Date(run.run_started_at)) / 1000)}s`
                  : '—';
                lines.push(
                  `| ${wf.emoji} ${wf.label} | ${run.run_number} | ${icon} **${run.conclusion || run.status}** | \`${run.head_branch}\` | ${dur} | [View](${run.html_url}) |`
                );
              } catch (e) {
                lines.push(`| ${wf.emoji} ${wf.label} | — | ❌ Error | — | — | ${e.message} |`);
              }
            }
            lines.push('');
            lines.push('## Quick links');
            lines.push('');
            lines.push(`- [All Actions runs](https://github.com/${owner}/${repo}/actions)`);
            lines.push(`- [Production deployments](https://github.com/${owner}/${repo}/deployments)`);
            lines.push(`- [Frontend CI](https://github.com/${owner}/${repo}/actions/workflows/frontend-ci.yml)`);
            lines.push(`- [Backend CI](https://github.com/${owner}/${repo}/actions/workflows/backend-ci.yml)`);
            lines.push('');
            lines.push('## Deploy (local VM)');
            lines.push('');
            lines.push('Requires a **self-hosted runner** on the Windows VM with labels `self-hosted`, `Windows`, `synapse`.');
            lines.push(`See [deploy/DEPLOY.md](https://github.com/${owner}/${repo}/blob/main/deploy/DEPLOY.md) for setup.`);
            const body = lines.join('\n');
            core.summary.addRaw(body);
            await core.summary.write();
            console.log(body);

      - name: Fail if any latest CI failed on main
        uses: actions/github-script@v7
        if: github.event_name == 'schedule' || github.event_name == 'push'
        with:
          script: |
            const check = async (file) => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: file,
                branch: 'main',
                per_page: 1,
              });
              const run = data.workflow_runs[0];
              return run && run.conclusion === 'success';
            };
            const fe = await check('frontend-ci.yml');
            const be = await check('backend-ci.yml');
            if (!fe || !be) {
              core.warning(`CI health: frontend=${fe}, backend=${be}`);
            }
